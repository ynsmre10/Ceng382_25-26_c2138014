<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Lock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <video id="backgroundVideo" autoplay loop muted>
        <source src="media/yoichi-isagi-blue-lock-moewalls-com.mp4" type="video/mp4">
    </video>

    <div id="clock"></div>

    <div class="soccer"></div>

    <button id="toggleButton"></button>
    
    <div class="container" id="registerContainer">
        <h2>Create Your Soccer Player!</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Name Surname" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="button" id="loginBtn">Submit</button>
        </form>
    </div>   

    <script src="script.js"></script>
</body>
</html>
